<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Athletes - Sports Fiesta</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: {
                                light: "#3b82f6",
                                DEFAULT: "#2563eb",
                                dark: "#1e40af",
                            },
                            accent: {
                                light: "#fde047",
                                DEFAULT: "#facc15",
                                dark: "#ca8a04",
                            },
                            danger: {
                                light: "#ef4444",
                                DEFAULT: "#dc2626",
                                dark: "#b91c1c",
                            },
                        },
                    },
                },
            };
        </script>
        <link rel="stylesheet" href="css/theme.css" data-sf-theme="true" />
        <link rel="icon" href="data:," />
    </head>
    <body class="bg-gradient-to-br from-gray-50 to-gray-100 min-h-screen">
        <!-- NAVIGATION -->
        <div id="nav-placeholder"></div>

        <!-- PAGE CONTENT -->
        <main class="p-8">
            <!-- Header -->
            <div class="max-w-6xl mx-auto mb-8">
                <h1 class="text-3xl font-bold text-gray-800 mb-2">
                    🏃‍♂️ Athletes
                </h1>
                <p class="text-gray-600">
                    All teams and participants in Sports Fiesta 2026
                </p>
            </div>

            <!-- Event Tabs -->
            <div class="max-w-6xl mx-auto mb-6">
                <div
                    class="flex flex-wrap gap-2 bg-white rounded-lg p-2 shadow"
                >
                    <button
                        id="tab-all"
                        class="tab-button active px-4 py-2 rounded font-medium transition"
                    >
                        All Events
                    </button>
                    <button
                        id="tab-badminton"
                        class="tab-button px-4 py-2 rounded font-medium transition"
                    >
                        🏸 Badminton
                    </button>
                    <button
                        id="tab-basketball3v3"
                        class="tab-button px-4 py-2 rounded font-medium transition"
                    >
                        🏀 Basketball 3v3
                    </button>
                    <button
                        id="tab-frisbee5v5"
                        class="tab-button px-4 py-2 rounded font-medium transition"
                    >
                        🥏 Frisbee 5v5
                    </button>
                    <button
                        id="tab-volleyball"
                        class="tab-button px-4 py-2 rounded font-medium transition"
                    >
                        🏐 Volleyball
                    </button>
                </div>
                <div
                    id="badminton-subtabs"
                    class="flex flex-wrap gap-2 bg-white rounded-lg p-2 shadow mt-2 hidden"
                >
                    <button
                        id="tab-badminton_singles_male"
                        class="badminton-subtab px-3 py-1.5 text-sm border rounded hover:border-primary hover:text-primary transition"
                    >
                        Single Male
                    </button>
                    <button
                        id="tab-badminton_singles_female"
                        class="badminton-subtab px-3 py-1.5 text-sm border rounded hover:border-primary hover:text-primary transition"
                    >
                        Single Female
                    </button>
                    <button
                        id="tab-badminton_doubles_male"
                        class="badminton-subtab px-3 py-1.5 text-sm border rounded hover:border-primary hover:text-primary transition"
                    >
                        Double Male
                    </button>
                    <button
                        id="tab-badminton_doubles_female"
                        class="badminton-subtab px-3 py-1.5 text-sm border rounded hover:border-primary hover:text-primary transition"
                    >
                        Double Female
                    </button>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loading" class="max-w-6xl mx-auto text-center py-8">
                <div class="text-gray-500">Loading athletes...</div>
            </div>

            <!-- Athletes Grid -->
            <div
                id="athletes-container"
                class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
            >
                <!-- Teams will be populated here -->
            </div>
        </main>

        <script src="js/include-nav.js"></script>
        <script src="js/firebase-init.js" type="module"></script>
        <script src="js/auth.js" type="module"></script>
        <script src="js/athletes.js" type="module"></script>
    </body>
</html>

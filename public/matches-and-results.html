<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Sports Fiesta · Matches & Results</title>

        <!-- Tailwind CDN -->
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            primary: {
                                light: "#3b82f6",
                                DEFAULT: "#2563eb",
                                dark: "#1e40af",
                            },
                            accent: {
                                light: "#fde047",
                                DEFAULT: "#facc15",
                                dark: "#ca8a04",
                            },
                            danger: {
                                light: "#ef4444",
                                DEFAULT: "#dc2626",
                                dark: "#b91c1c",
                            },
                        },
                    },
                },
            };
        </script>
        <link rel="stylesheet" href="css/theme.css" data-sf-theme="true" />
        <link rel="icon" href="data:," />
    </head>

    <body class="bg-gray-100 min-h-screen">
        <div id="nav-placeholder"></div>

        <main class="max-w-screen-xl mx-auto p-4">
            <h1 class="text-3xl font-semibold mb-6">
                Matches &amp; Results
            </h1>

            <!-- sport tabs -->
            <div id="sport-tabs" class="flex flex-col gap-3 mb-6">
                <div class="flex flex-wrap gap-4">
                    <button
                        data-sport="badminton"
                        class="sport-tab tab-btn px-4 py-2 font-medium border-b-2 border-transparent hover:text-primary hover:border-primary transition"
                    >
                        Badminton
                    </button>
                    <button
                        data-sport="frisbee5v5"
                        class="sport-tab tab-btn px-4 py-2 font-medium border-b-2 border-transparent hover:text-primary hover:border-primary transition"
                    >
                        Frisbee
                    </button>
                    <button
                        data-sport="basketball3v3"
                        class="sport-tab tab-btn px-4 py-2 font-medium border-b-2 border-transparent hover:text-primary hover:border-primary transition"
                    >
                        Basketball
                    </button>
                    <button
                        data-sport="volleyball"
                        class="sport-tab tab-btn px-4 py-2 font-medium border-b-2 border-transparent hover:text-primary hover:border-primary transition"
                    >
                        Volleyball
                    </button>
                </div>
                <div id="badminton-subtabs" class="flex flex-wrap gap-3">
                    <button data-sport="badminton_singles_male" class="badminton-subtab px-3 py-1.5 text-sm border rounded hover:border-primary hover:text-primary transition">Single Male</button>
                    <button data-sport="badminton_singles_female" class="badminton-subtab px-3 py-1.5 text-sm border rounded hover:border-primary hover:text-primary transition">Single Female</button>
                    <button data-sport="badminton_doubles_male" class="badminton-subtab px-3 py-1.5 text-sm border rounded hover:border-primary hover:text-primary transition">Double Male</button>
                    <button data-sport="badminton_doubles_female" class="badminton-subtab px-3 py-1.5 text-sm border rounded hover:border-primary hover:text-primary transition">Double Female</button>
                </div>
            </div>

            <div id="match-container" class="text-sm mb-10"></div>
            <section id="ranking-section" class="mt-8">
                <h2 class="text-2xl font-semibold mb-4">Qualifiers Rankings</h2>
                <div id="ranking-container" class="space-y-6"></div>
            </section>
        </main>

        <script src="js/include-nav.js"></script>
        <script src="js/firebase-init.js" type="module"></script>
        <script src="js/auth.js" type="module"></script>
        <script src="js/matches.js" type="module"></script>
    </body>
</html>

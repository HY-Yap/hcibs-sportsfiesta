<div
    id="login-modal"
    class="sf-login-backdrop hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="login-modal-title"
>
    <div class="sf-login-dialog">
        <button
            type="button"
            class="sf-modal-close"
            onclick="closeModal()"
            aria-label="Close login"
        >
            <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                aria-hidden="true"
            >
                <path d="M6 6l12 12M18 6L6 18" />
            </svg>
        </button>

        <h2 id="login-modal-title">Login</h2>

        <label class="sf-field-label" for="modal-email">Email</label>
        <input
            id="modal-email"
            class="sf-login-input"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
        />

        <label class="sf-field-label" for="modal-pass">Password</label>
        <input
            id="modal-pass"
            class="sf-login-input"
            type="password"
            placeholder="Password"
            autocomplete="current-password"
        />

        <button id="forgot-btn" type="button" class="sf-forgot-button">
            Forgot password?
        </button>

        <p id="modal-error" class="text-red-600 text-sm mb-4 hidden"></p>

        <div class="sf-modal-actions">
            <button type="button" onclick="closeModal()" class="sf-modal-button">
                Cancel
            </button>
            <button
                type="button"
                onclick="handleModalLogin()"
                class="sf-modal-button sf-modal-button--primary"
            >
                Login
            </button>
        </div>
    </div>
</div>
